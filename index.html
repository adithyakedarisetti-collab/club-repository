<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHTSA Inventory Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">DHTSA Inventory Tracker</h1>
        
        <!-- Duplicate Warning Banner Modal / Toast Container -->
        <div id="toastNotification" class="hidden fixed top-5 right-5 z-50 bg-amber-500 text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 transition-opacity duration-300">
            <span id="toastMessage">Duplicate item detected and automatically stacked!</span>
            <button onclick="hideToast()" class="font-bold text-lg">&times;</button>
        </div>

        <!-- Add / Edit Item Form -->
        <form id="itemForm" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 p-4 bg-gray-50 rounded-lg">
            <input type="hidden" id="editIndex" value="-1">
            <input type="text" id="itemName" placeholder="Item Name" required class="border p-2 rounded bg-white">
            <input type="text" id="category" placeholder="Category" required class="border p-2 rounded bg-white">
            <select id="status" class="border p-2 rounded bg-white">
                <option value="Available">Available</option>
                <option value="Checked Out">Checked Out</option>
                <option value="Discontinued">Discontinued</option>
            </select>
            <input type="number" step="0.01" id="itemizedPrice" placeholder="Itemized Price ($)" required class="border p-2 rounded bg-white">
            <input type="number" step="0.01" id="wholesalePrice" placeholder="Wholesale Price ($)" required class="border p-2 rounded bg-white">
            <div class="flex gap-2">
                <input type="number" id="totalQuantity" placeholder="Total Stock" required class="border p-2 rounded bg-white flex-1">
                <input type="number" id="availableQuantity" placeholder="Available Stock" required class="border p-2 rounded bg-white flex-1">
            </div>
            <div class="md:col-span-3 flex gap-2">
                <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 text-white p-2 rounded font-semibold hover:bg-blue-700">Add Item</button>
                <button type="button" id="cancelEditBtn" onclick="cancelEdit()" class="hidden bg-gray-400 text-white px-4 py-2 rounded font-semibold hover:bg-gray-500">Cancel</button>
            </div>
        </form>

        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <input type="text" id="searchKeyword" placeholder="Search keyword or category..." class="border p-2 rounded flex-1 bg-white" oninput="renderTable()">
            <select id="filterStatus" class="border p-2 rounded bg-white" onchange="renderTable()">
                <option value="">All Statuses</option>
                <option value="Available">Available</option>
                <option value="Checked Out">Checked Out</option>
                <option value="Discontinued">Discontinued</option>
            </select>
        </div>

        <!-- Financial Summary -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                <p class="text-sm text-blue-600 font-semibold">Total Available Qty</p>
                <p id="sumQty" class="text-xl font-bold text-blue-900">0</p>
            </div>
            <div class="bg-green-50 p-4 rounded-lg border border-green-200">
                <p class="text-sm text-green-600 font-semibold">Total Retail Value</p>
                <p id="sumRetail" class="text-xl font-bold text-green-900">$0.00</p>
            </div>
            <div class="bg-purple-50 p-4 rounded-lg border border-purple-200">
                <p class="text-sm text-purple-600 font-semibold">Total Wholesale Value</p>
                <p id="sumWholesale" class="text-xl font-bold text-purple-900">$0.00</p>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-200 text-gray-700 text-sm">
                        <th class="p-3">ID</th>
                        <th class="p-3">Item Name</th>
                        <th class="p-3">Category</th>
                        <th class="p-3">Status</th>
                        <th class="p-3">Retail</th>
                        <th class="p-3">Wholesale</th>
                        <th class="p-3">Item Stock (Avail / Total)</th>
                        <th class="p-3">Logged Date</th>
                        <th class="p-3">Actions</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody" class="text-sm divide-y divide-gray-200">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 200 Distinct Hex Codes Palette for Category Color Highlighting
        const HEX_GRADIENT_200 = [
            "#5A1893","#7B2CBF","#9D4EDD","#C77DFF","#E0AAFF","#3A0CA3","#4361EE","#4CC9F0","#4895EF","#560BAD",
            "#F72585","#B5179E","#7209B7","#560BAD","#480CA8","#3A0CA3","#3F37C9","#4361EE","#4895EF","#4CC9F0",
            "#FF595E","#FFCA3A","#8AC926","#1982C4","#6A4C93","#FF70A6","#FF9770","#FFD670","#E9FF70","#70D6FF",
            "#2A9D8F","#264653","#E76F51","#F4A261","#E9C46A","#606C38","#283618","#FEFAE0","#DDA15E","#BC6C25",
            "#6B705C","#A5A58D","#B7B7A4","#FFE8D6","#DD7230","#F4C430","#32CD32","#00FA9A","#00CED1","#1E90FF",
            "#9370DB","#FF1493","#FF69B4","#FFB6C1","#00FFFF","#7FFFD4","#F0E68C","#BDB76B","#EEE8AA","#9ACD32",
            "#556B2F","#8FBC8F","#2E8B57","#3CB371","#20B2AA","#008B8B","#008080","#4682B4","#B0C4DE","#6495ED",
            "#7B68EE","#6A5ACD","#483D8B","#48D1CC","#00FFFF","#00FF7F","#ADFF2F","#FFFF00","#FFD700","#FFA500",
            "#FF8C00","#FF4500","#DC143C","#FF0000","#B22222","#8B0000","#CD5C5C","#F08080","#FA8072","#E9967A",
            "#FFA07A","#FFDEAD","#DEB887","#D2B48C","#BC8F8F","#F4A460","#DAA520","#B8860B","#CD853F","#D2691E",
            "#A0522D","#8B4513","#FFF8DC","#FFEBCD","#FFE4C4","#FFFAF0","#FDF5E6","#FAF0E6","#FAEBD7","#FFEFD5",
            "#FFE4B5","#FFDAB9","#EEE2B8","#FFFACD","#FFF8E7","#F5DEB3","#F5FFFA","#F0FFF0","#F5F5DC","#FDFDFD",
            "#E6E6FA","#FFF0F5","#FFE4E1","#F0F8FF","#F8F8FF","#F5FFFA","#F0FFFF","#F4F4F4","#E0E0E0","#D3D3D3",
            "#C0C0C0","#A9A9A9","#808080","#696969","#505050","#383838","#202020","#101010","#000000","#1B4931",
            "#1B3B6F","#6247AA","#A06CD5","#B392AC","#481D24","#540B0E","#9E2A2B","#335C67","#E09F3E","#540B0E",
            "#003049","#D62828","#F77F00","#FCBF49","#EAE2B7","#2B2D42","#8D99AE","#EDF2F4","#EF233C","#D90429",
            "#8CB369","#F4E2BB","#F4A261","#E76F51","#264653","#2A9D8F","#E9C46A","#F4A261","#E76F51","#264653",
            "#606C38","#283618","#FEFAE0","#DDA15E","#BC6C25","#6B705C","#A5A58D","#B7B7A4","#FFE8D6","#DD7230",
            "#90E0EF","#00B4D8","#0077B6","#03045E","#ADE8F4","#CAF0F8","#94D2BD","#0A9396","#005F73","#9B5DE5",
            "#F15BB5","#FFEE56","#00F5D4","#00BBF9","#6C757D","#495057","#343A40","#212529","#CED4DA","#DEE2E6"
        ];

        let inventory = JSON.parse(localStorage.getItem('dhtsa_library_inventory')) || [
            { id: 1, itemName: "Example Item A", category: "Category 1", status: "Available", itemizedPrice: 10.00, wholesalePrice: 5.00, availableQty: 4, totalQty: 5, dateLogged: new Date().toISOString().slice(0, 19).replace('T', ' ') },
            { id: 2, itemName: "Example Item B", category: "Category 1", status: "Available", itemizedPrice: 20.00, wholesalePrice: 12.00, totalQty: 8, availableQty: 8, dateLogged: new Date().toISOString().slice(0, 19).replace('T', ' ') }
        ];

        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').innerText = message;
            toast.classList.remove('hidden');
            setTimeout(() => { hideToast(); }, 5000);
        }

        function hideToast() {
            document.getElementById('toastNotification').classList.add('hidden');
        }

        function saveAndRefresh() {
            localStorage.setItem('dhtsa_library_inventory', JSON.stringify(inventory));
            renderTable();
        }

        document.getElementById('itemForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const nameInput = document.getElementById('itemName').value.trim();
            const catInput = document.getElementById('category').value.trim();
            const statusInput = document.getElementById('status').value;
            const itemPriceInput = parseFloat(document.getElementById('itemizedPrice').value);
            const wholesalePriceInput = parseFloat(document.getElementById('wholesalePrice').value);
            const totalQtyInput = parseInt(document.getElementById('totalQuantity').value);
            const availableQtyInput = parseInt(document.getElementById('availableQuantity').value);

            if (editIndex !== -1) {
                inventory[editIndex].itemName = nameInput;
                inventory[editIndex].category = catInput;
                inventory[editIndex].status = statusInput;
                inventory[editIndex].itemizedPrice = itemPriceInput;
                inventory[editIndex].wholesalePrice = wholesalePriceInput;
                inventory[editIndex].totalQty = totalQtyInput;
                inventory[editIndex].availableQty = Math.min(availableQtyInput, totalQtyInput);
                
                showToast(`Item successfully updated!`);
                cancelEdit();
            } else {
                const existingIndex = inventory.findIndex(item => 
                    item.itemName.toLowerCase() === nameInput.toLowerCase() &&
                    item.category.toLowerCase() === catInput.toLowerCase() &&
                    item.itemizedPrice === itemPriceInput &&
                    item.wholesalePrice === wholesalePriceInput
                );

                if (existingIndex !== -1) {
                    showToast(`Existing item matched! Quantities combined into item ID ${inventory[existingIndex].id}.`);
                    inventory[existingIndex].totalQty += totalQtyInput;
                    inventory[existingIndex].availableQty = Math.min(inventory[existingIndex].availableQty + availableQtyInput, inventory[existingIndex].totalQty);
                } else {
                    const newItem = {
                        id: inventory.length ? Math.max(...inventory.map(i => i.id)) + 1 : 1,
                        itemName: nameInput,
                        category: catInput,
                        status: statusInput,
                        itemizedPrice: itemPriceInput,
                        wholesalePrice: wholesalePriceInput,
                        totalQty: totalQtyInput,
                        availableQty: Math.min(availableQtyInput, totalQtyInput),
                        dateLogged: new Date().toISOString().slice(0, 19).replace('T', ' ')
                    };
                    inventory.push(newItem);
                }
                this.reset();
            }

            saveAndRefresh();
        });

        function editItem(id) {
            const index = inventory.findIndex(i => i.id === id);
            if (index !== -1) {
                const item = inventory[index];
                document.getElementById('editIndex').value = index;
                document.getElementById('itemName').value = item.itemName;
                document.getElementById('category').value = item.category;
                document.getElementById('status').value = item.status;
                document.getElementById('itemizedPrice').value = item.itemizedPrice;
                document.getElementById('wholesalePrice').value = item.wholesalePrice;
                document.getElementById('totalQuantity').value = item.totalQty;
                document.getElementById('availableQuantity').value = item.availableQty;

                document.getElementById('submitBtn').innerText = "Update Item";
                document.getElementById('submitBtn').classList.replace('bg-blue-600', 'bg-amber-600');
                document.getElementById('submitBtn').classList.replace('hover:bg-blue-700', 'hover:bg-amber-700');
                document.getElementById('cancelEditBtn').classList.remove('hidden');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function cancelEdit() {
            document.getElementById('editIndex').value = -1;
            document.getElementById('itemForm').reset();
            document.getElementById('submitBtn').innerText = "Add Item";
            document.getElementById('submitBtn').classList.replace('bg-amber-600', 'bg-blue-600');
            document.getElementById('submitBtn').classList.replace('hover:bg-amber-700', 'hover:bg-blue-700');
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        function updateAvailable(id, newAvail) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                const val = parseInt(newAvail);
                if (!isNaN(val) && val >= 0 && val <= item.totalQty) {
                    item.availableQty = val;
                    saveAndRefresh();
                }
            }
        }

        function updateTotal(id, newTotal) {
            const item = inventory.find(i => i.id === id);
            if (item) {
                const val = parseInt(newTotal);
                if (!isNaN(val) && val >= 0) {
                    item.totalQty = val;
                    if (item.availableQty > val) {
                        item.availableQty = val; 
                    }
                    saveAndRefresh();
                }
            }
        }

        function deleteItem(id) {
            inventory = inventory.filter(item => item.id !== id);
            saveAndRefresh();
        }

        function renderTable() {
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';

            const categoryCounts = {};
            inventory.forEach(item => {
                const cat = item.category.trim();
                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
            });

            const catColorMap = {};
            let paletteIndex = 0;
            for (let cat in categoryCounts) {
                if (categoryCounts[cat] >= 2) {
                    catColorMap[cat] = HEX_GRADIENT_200[paletteIndex % HEX_GRADIENT_200.length];
                    paletteIndex++;
                }
            }

            let totalAvailQtySum = 0;
            let totalRetail = 0;
            let totalWholesale = 0;

            const filtered = inventory.filter(item => {
                const matchesKeyword = item.itemName.toLowerCase().includes(keyword) || item.category.toLowerCase().includes(keyword);
                const matchesStatus = statusFilter === "" || item.status === statusFilter;
                return matchesKeyword && matchesStatus;
            });

            filtered.forEach(item => {
                if (item.status === 'Available') {
                    totalAvailQtySum += item.availableQty;
                    totalRetail += (item.itemizedPrice * item.availableQty);
                    totalWholesale += (item.wholesalePrice * item.availableQty);
                }

                const categoryBg = catColorMap[item.category.trim()] ? `background-color: ${catColorMap[item.category.trim()]}; color: #000; font-weight: 500;` : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3">${item.id}</td>
                    <td class="p-3 font-medium">${item.itemName}</td>
                    <td class="p-3 rounded" style="${categoryBg}">${item.category}</td>
                    <td class="p-3">
                        <select onchange="const item = inventory.find(i => i.id === ${item.id}); item.status = this.value; saveAndRefresh();" class="border p-1 rounded text-xs bg-white">
                            <option value="Available" ${item.status === 'Available' ? 'selected' : ''}>Available</option>
                            <option value="Checked Out" ${item.status === 'Checked Out' ? 'selected' : ''}>Checked Out</option>
                            <option value="Discontinued" ${item.status === 'Discontinued' ? 'selected' : ''}>Discontinued</option>
                        </select>
                    </td>
                    <td class="p-3">$${item.itemizedPrice.toFixed(2)}</td>
                    <td class="p-3">$${item.wholesalePrice.toFixed(2)}</td>
                    <td class="p-3 flex items-center space-x-1">
                        <input type="number" min="0" max="${item.totalQty}" value="${item.availableQty}" onchange="updateAvailable(${item.id}, this.value)" class="border p-1 rounded w-14 text-center bg-white" title="Available">
                        <span>/</span>
                        <input type="number" min="0" value="${item.totalQty}" onchange="updateTotal(${item.id}, this.value)" class="border p-1 rounded w-14 text-center bg-white" title="Total">
                    </td>
                    <td class="p-3 text-xs text-gray-500">${item.dateLogged}</td>
                    <td class="p-3 space-x-2">
                        <button onclick="editItem(${item.id})" class="text-blue-600 hover:text-blue-800 font-semibold">Edit</button>
                        <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800 font-semibold">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('sumQty').innerText = totalAvailQtySum;
            document.getElementById('sumRetail').innerText = `$${totalRetail.toFixed(2)}`;
            document.getElementById('sumWholesale').innerText = `$${totalWholesale.toFixed(2)}`;
        }

        renderTable();
    </script>
</body>
</html>
